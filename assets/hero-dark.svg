<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Mandakhbayar — Frontend &amp; Flutter developer</title>
  <desc id="d">Software engineering student from Mongolia living in South Korea, bringing Mongolian traditional music into the digital world.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110A"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="950" cy="190" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D4A017" stop-opacity=".30"/>
      <stop offset="1" stop-color="#D4A017" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6D365"/>
      <stop offset="1" stop-color="#D4A017"/>
    </linearGradient>
    <pattern id="key" width="24" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 13H20V1H6V9H14V5" fill="none" stroke="#D4A017" stroke-width="1.5" stroke-opacity=".55"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 15px; font-weight: 600; letter-spacing: 3.2px; fill: #E3B341; }
    .name { font-size: 74px; font-weight: 800; letter-spacing: -2px; fill: #FAF6EC; }
    .role { font-size: 27px; font-weight: 600; fill: url(#gold); }
    .line { font-size: 18px; fill: #B4AE9F; }
    .chip rect { fill: #FFFFFF; fill-opacity: .06; stroke: #FFFFFF; stroke-opacity: .14; }
    .chip text { font-size: 14px; font-weight: 500; fill: #DAD4C5; }
    .s { fill: none; stroke: url(#gold); stroke-linecap: round; transform-origin: 950px 190px;
         animation: vib 2.6s ease-in-out infinite alternate; }
    .s2 { animation-duration: 1.9s; } .s3 { animation-duration: 1.4s; } .s4 { animation-duration: 1.1s; }
    @keyframes vib { from { transform: scaleY(1); } to { transform: scaleY(-1); } }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- Чавхдасны хэлбэлзэл: үндсэн ая ба гурван дээд ая -->
    <g>
      <line x1="760" y1="190" x2="1140" y2="190" stroke="#D4A017" stroke-opacity=".25" stroke-width="1"/>
      <path class="s"    stroke-width="3"   d="M760 190Q950 30 1140 190"/>
      <path class="s s2" stroke-width="2.2" stroke-opacity=".75" d="M760 190Q855 90 950 190T1140 190"/>
      <path class="s s3" stroke-width="1.6" stroke-opacity=".55" d="M760 190Q823.3 120 886.7 190T1013.3 190T1140 190"/>
      <path class="s s4" stroke-width="1.2" stroke-opacity=".4"  d="M760 190Q807.5 140 855 190T950 190T1045 190T1140 190"/>
      <rect x="754" y="150" width="6" height="80" rx="3" fill="#D4A017"/>
      <rect x="1140" y="150" width="6" height="80" rx="3" fill="#D4A017"/>
    </g>

    <text class="eyebrow" x="64" y="92">САЙН БАЙНА УУ · HELLO</text>
    <text class="name" x="60" y="174">Mandakhbayar</text>
    <text class="role" x="64" y="222">Frontend &amp; Flutter developer</text>
    <text class="line" x="64" y="262">Bringing Mongolian traditional music into the digital world.</text>

    <g class="chip" transform="translate(64 292)">
      <rect width="206" height="34" rx="17"/>
      <text x="103" y="22" text-anchor="middle">Mongolia → South Korea</text>
    </g>
    <g class="chip" transform="translate(282 292)">
      <rect width="142" height="34" rx="17"/>
      <text x="71" y="22" text-anchor="middle">Figma → Flutter</text>
    </g>
    <g class="chip" transform="translate(436 292)">
      <rect width="150" height="34" rx="17"/>
      <text x="75" y="22" text-anchor="middle">React · Supabase</text>
    </g>

    <rect x="0" y="352" width="1200" height="14" fill="url(#key)"/>
  </g>
</svg>
